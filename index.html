<!DOCTYPE html>

<head>

  <meta property="og:url" content="https://stivenportfolio.vercel.app/" />
  <meta property="og:image" content="https://stivenportfolio.vercel.app/assets/og-image.jpg" />
  <meta property="og:image:width" content="1200" />

  <meta name="twitter:description" content="Video, graphic design & web app — portfolio A. STIVEN R., Jayapura." />
  <meta name="twitter:image" content="https://stivenportfolio.vercel.app/assets/og-image.jpg" />
  <meta name="theme-color" content="#16110c" />
  <meta property="og:locale" content="id_ID" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314100b'/%3E%3Ctext x='32' y='45' font-family='Georgia' font-style='italic' font-size='38' fill='%23e8930c' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />

</head>
<body>

  <div class="grain"></div>

  <!-- ============ NAV ============ -->
  <header class="nav" id="nav">
    <a class="logo" href="#top" id="logo">STIVEN<sup>®</sup></a>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#works">Works</a>
      <a href="admin.html" class="nav-admin">● Admin</a>
    </nav>
  </header>

  <!-- ============ HERO (Fluxora-style) ============ -->
  <section class="hero" id="top">
    <div class="hero-bg" id="heroBg"><img id="heroImg" src="assets/hero.jpg" alt="Amber light raking across a visor" /></div>
    <div class="hero-shade"></div>

    <div class="hero-inner">
      <h1 class="hero-title">
        <span class="line"><span id="headlineA">MY NAME IS STIVEN</span></span>
        <span class="line"><span id="headlineB"><em class="serif">And This is My World</em></span></span>
      </h1>
      <div class="hero-sub">
        <p class="hero-tagline" id="tagline"></p>
        <span class="pill"><i></i><span id="avail">Available for work</span></span>
      </div>
    </div>

    <a class="hero-scroll" href="#about">Scroll</a>

    <div class="hero-stats" id="heroStats"></div>
  </section>

  <!-- ============ MARQUEE ============ -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>

  <!-- ============ ABOUT ============ -->
  <section class="section" id="about">
    <p class="sec-label reveal">01 — Siapa Saya / About</p>
    <h2 class="sec-title reveal" id="aboutTitle"></h2>
    <div class="about-grid">
      <div class="portrait-wrap reveal">
        <img id="portraitImg" src="assets/portrait.jpg" alt="Portrait of Stiven" />
        <p class="portrait-cap" id="portraitCap"></p>
      </div>
      <div class="about-text reveal">
        <div id="bio"></div>
        <div class="info-list" id="infoList"></div>
        <div class="chips" id="chips"></div>
        <div class="social-row" id="socials"></div>
      </div>
    </div>
  </section>

  <!-- ============ WORKS ============ -->
  <section class="section" id="works" style="padding-top:40px">
    <p class="sec-label reveal">02 — Karya Saya / Works</p>
    <div class="works-head">
      <h2 class="sec-title reveal" id="worksTitle"></h2>
      <div class="filters reveal" id="filters">
        <button class="active" data-filter="all">All <span class="count" id="countAll"></span></button>
        <button data-filter="video">Videos <span class="count" id="countVideo"></span></button>
        <button data-filter="design">Designs <span class="count" id="countDesign"></span></button>
        <button data-filter="webapp">Web Apps <span class="count" id="countWebapp"></span></button>
      </div>
    </div>
    <div class="masonry" id="worksGrid"></div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <p class="sec-label" style="color:var(--amber-soft)">03 — Contact</p>
    <h2 class="cta-title reveal" id="ctaTitle"></h2>
    <a class="mail reveal" id="mailLink" href="mailto:hello@stiven.dev">hello@stiven.dev</a>
    <div class="social-row reveal" id="footSocials"></div>
    <div class="share-row left reveal" id="siteShare"></div>
    <div class="footer-bottom">
      <span>© <span id="year">2026</span> STIVEN — Jayapura, Papua, Indonesia</span>
      <a href="admin.html">Admin panel</a>
    </div>
  </footer>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <span class="lb-count" id="lbCount"></span>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">←</button>
    <div class="lb-stage" id="lbStage"></div>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next">→</button>
    <div class="lb-caption" id="lbCaption"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/vendor/supabase.min.js"></script>
  <script>if(!window.supabase){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";document.head.appendChild(s);}</script>
  <script src="js/supabase-config.js?v=20261107g"></script>
  <script src="js/data.js?v=20261107g"></script>
  <script src="js/main.js?v=20261107g"></script>
</body>
</html>
