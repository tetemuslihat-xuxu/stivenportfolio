<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Color Lab — Palette Generator (demo)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #14100b; color: #efe7d8; overflow: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid rgba(239,231,216,.12); }
  header h1 { font-size: 1rem; letter-spacing: .3em; font-weight: 700; }
  header h1 span { color: #e8930c; }
  #gen { font: inherit; font-weight: 700; letter-spacing: .12em; background: #e8930c; color: #14100b; border: 0; padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: .2s; }
  #gen:hover { filter: brightness(1.15); transform: translateY(-1px); }
  #swatches { flex: 1; display: flex; min-height: 0; }
  .sw { flex: 1; position: relative; cursor: pointer; display: flex; align-items: flex-end; padding: 20px; transition: flex .35s cubic-bezier(.22,1,.36,1); }
  .sw:hover { flex: 1.7; }
  .sw .hex { background: rgba(0,0,0,.5); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: .82rem; letter-spacing: .08em; backdrop-filter: blur(4px); }
  footer { padding: 9px 24px; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(239,231,216,.45); border-top: 1px solid rgba(239,231,216,.12); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 80px); background: #efe7d8; color: #14100b; padding: 10px 24px; border-radius: 999px; font-size: .85rem; font-weight: 600; transition: transform .35s cubic-bezier(.22,1,.36,1); }
  #toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
  <header>
    <h1>COLOR <span>LAB</span></h1>
    <button id="gen">GENERATE ✦</button>
  </header>
  <div id="swatches"></div>
  <footer>click a swatch to copy its hex — demo web app by A. STIVEN R.</footer>
  <div id="toast"></div>
<script>
(function () {
  var sw = document.getElementById('swatches');
  var toastEl = document.getElementById('toast');

  function toHex(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; };
    var a = s * Math.min(l, 1 - l);
    var f = function (n) {
      var c = l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return Math.round(255 * c).toString(16).padStart(2, '0');
    };
    return '#' + f(0) + f(8) + f(4);
  }

  function gen() {
    var base = Math.floor(Math.random() * 360);
    sw.innerHTML = '';
    for (var i = 0; i < 5; i++) {
      var h = Math.round((base + i * 30 + (Math.random() * 12 - 6)) % 360 + 360) % 360;
      var s = 58 + Math.random() * 26;
      var l = 38 + i * 8;
      var hx = toHex(h, s, l);
      var d = document.createElement('div');
      d.className = 'sw';
      d.style.background = 'hsl(' + h + ',' + s + '%,' + l + '%)';
      d.innerHTML = '<span class="hex">' + hx + '</span>';
      d.addEventListener('click', function (hex) { return function () { copy(hex); }; }(hx));
      sw.appendChild(d);
    }
  }

  function copy(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).catch(function () { fallbackCopy(t); });
    } else { fallbackCopy(t); }
    toastEl.textContent = t + ' copied ✓';
    toastEl.classList.add('show');
    clearTimeout(window._t);
    window._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1500);
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }

  document.getElementById('gen').addEventListener('click', gen);
  gen();
})();
</script>
</body>
</html>
